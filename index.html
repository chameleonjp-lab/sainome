<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <title>サイノメ</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main class="app">
    <header class="hud">
      <div class="brand"><span>ACTION PUZZLE</span><strong>サイノメ</strong></div>
      <div class="hud-item"><span>ROLL</span><strong id="roll-count">0</strong></div>
      <div class="hud-item"><span>CHAIN</span><strong id="chain-count">0</strong></div>
      <div class="hud-item"><span>CLEAR</span><strong id="clear-count">0</strong></div>
      <button id="reset-button" class="reset-button" type="button">やり直す</button>
    </header>

    <section id="stage" class="stage" aria-label="サイノメの3Dゲーム画面">
      <canvas id="game-canvas"></canvas>
      <div id="loading" class="loading">3D盤面を準備中…</div>
      <div id="message" class="message">盤面をスワイプして移動</div>
    </section>

    <nav class="controls" aria-label="移動操作">
      <button data-direction="up" class="up" aria-label="奥へ移動">▲</button>
      <button data-direction="left" class="left" aria-label="左へ移動">◀</button>
      <button data-direction="down" class="down" aria-label="手前へ移動">▼</button>
      <button data-direction="right" class="right" aria-label="右へ移動">▶</button>
    </nav>

    <aside class="prototype-note">
      <strong>消し方</strong>
      <span>同じ目を、目の数以上つなげる。沈んでいる間に足すと連鎖。</span>
    </aside>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
