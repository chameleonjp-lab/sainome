<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0b1018">
  <title>サイノメ</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <main id="app" class="app" data-screen="home">
    <header class="hud" aria-label="ゲームの状況">
      <div class="brand"><span id="mode-brand">60 SECOND PUZZLE</span><strong>サイノメ</strong></div>
      <div id="time-panel" class="hud-item"><span>TIME</span><strong id="remaining-time">60</strong></div>
      <div id="score-panel" class="hud-item hud-score"><span>SCORE</span><strong id="score-count">0</strong></div>
      <div class="hud-item"><span>CHAIN</span><strong id="chain-count">0</strong></div>
      <div class="hud-item"><span>CLEAR</span><strong id="clear-count">0</strong></div>
    </header>

    <section id="stage" class="stage" aria-label="サイノメの3Dゲーム画面">
      <canvas id="game-canvas" tabindex="-1"></canvas>
      <div id="loading" class="loading" role="status">3D盤面を準備中…</div>
      <div id="message" class="message" aria-live="polite">盤面に沿って斜めにフリック</div>

      <section id="home-screen" class="screen-panel home-screen" aria-labelledby="game-title">
        <p id="home-kicker" class="screen-kicker">60秒で、つないで、沈める</p>
        <h1 id="game-title">サイノメ</h1>
        <p class="screen-lead">サイコロを転がし、上面と同じ数以上を縦横につなげて得点を競います。</p>
        <fieldset id="mode-picker" class="mode-picker">
          <legend>プレイ時間を選ぶ</legend>
          <div class="mode-options">
            <label class="mode-choice">
              <input type="radio" name="game-mode" value="60-seconds" checked>
              <span><strong>60秒</strong><small>30秒後に2個追加</small></span>
            </label>
            <label class="mode-choice">
              <input type="radio" name="game-mode" value="180-seconds">
              <span><strong>180秒</strong><small>3個以上消すと生成</small></span>
            </label>
          </div>
        </fieldset>
        <ol class="quick-rules" aria-label="遊び方">
          <li><b>1</b> 盤面に沿って斜めフリック</li>
          <li><b>2</b> 同じ目をつなぐ</li>
          <li><b>3</b> 連鎖で得点アップ</li>
        </ol>
        <p id="home-error" class="home-error" role="alert" hidden></p>
        <button id="start-button" class="primary-button" type="button">ゲーム開始</button>
      </section>

      <section id="countdown-screen" class="screen-panel countdown-screen" aria-live="assertive" hidden>
        <p>READY</p>
        <strong id="countdown-value">3</strong>
      </section>

      <section id="result-screen" class="screen-panel result-screen" aria-labelledby="result-title" hidden>
        <p id="result-kicker" class="screen-kicker">60秒モード · TIME UP</p>
        <h2 id="result-title">結果</h2>
        <div class="result-score">
          <span>SCORE</span>
          <strong id="result-score">0</strong>
        </div>
        <dl class="result-stats">
          <div><dt>消した数</dt><dd id="result-cleared">0</dd></div>
          <div><dt>最大連鎖</dt><dd id="result-chain">0</dd></div>
        </dl>
        <div class="result-actions">
          <button id="replay-button" class="primary-button" type="button">もう一度</button>
          <button id="result-home-button" class="secondary-button" type="button">ホームへ</button>
        </div>
      </section>
    </section>

    <aside id="play-note" class="prototype-note" hidden>
      <strong id="play-note-title">60秒</strong>
      <span id="play-note-text">斜めフリックで移動。同じ目を、目の数以上つなげる。</span>
    </aside>
  </main>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
