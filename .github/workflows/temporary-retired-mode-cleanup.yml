name: Temporary retired mode cleanup

on:
  push:
    branches:
      - agent/sainome-ranking-ux-cleanup

permissions:
  contents: write

concurrency:
  group: temporary-retired-mode-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[retired-mode-cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v5
        with:
          ref: agent/sainome-ranking-ux-cleanup
          fetch-depth: 0

      - name: Remove retired mode runtime state
        run: |
          node <<'NODE'
          const { readFileSync, writeFileSync } = require('node:fs');

          function replaceExact(path, from, to, expectedCount) {
            const source = readFileSync(path, 'utf8');
            const count = source.split(from).length - 1;
            if (count !== expectedCount) {
              throw new Error(`${path}: expected ${expectedCount} matches, found ${count}`);
            }
            writeFileSync(path, source.replaceAll(from, to), 'utf8');
          }

          replaceExact(
            'js/webgl-game.js',
            '    this.sixtySecondSpawnedCount = 0;\n',
            '',
            2
          );
          replaceExact(
            'js/webgl-game.js',
            '      sixtySecondSpawnedCount: this.sixtySecondSpawnedCount,\n',
            '',
            1
          );
          replaceExact(
            'js/webgl-game.js',
            '    this.sixtySecondSpawnedCount = state.sixtySecondSpawnedCount;\n',
            '',
            1
          );
          replaceExact(
            'js/game-state-storage.js',
            "    sixtySecondSpawnedCount: requireSafeInteger(\n      source.sixtySecondSpawnedCount,\n      'sixtySecondSpawnedCount',\n      { min: 0, max: 2 }\n    ),\n",
            '',
            1
          );
          replaceExact(
            'test/game-state-storage.test.js',
            '    sixtySecondSpawnedCount: 0,\n',
            '',
            1
          );
          replaceExact(
            'test/retired-modes.test.js',
            "  'sainome_180_seconds'\n];",
            "  'sainome_180_seconds',\n  'sixtySecondSpawnedCount'\n];",
            1
          );
          NODE

      - name: Verify retired state is gone
        run: |
          ! grep -R --line-number --fixed-string 'sixtySecondSpawnedCount' js test/game-state-storage.test.js

      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add js/webgl-game.js js/game-state-storage.js test/game-state-storage.test.js test/retired-modes.test.js
          git commit -m 'remove retired mode runtime state [retired-mode-cleanup]'
          git push origin HEAD:agent/sainome-ranking-ux-cleanup
