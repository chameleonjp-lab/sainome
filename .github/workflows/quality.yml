name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Build release artifact
        run: node scripts/prepare-github-pages.js

      - name: Verify ranking runtime hotfix
        run: |
          grep -q '20260818-ranking-runtime-hotfix' _site/index.html
          grep -q 'ranking-client.js?v=20260818-ranking-runtime-hotfix' _site/js/main.js
          grep -q 'if (false && submission.canSubmit === false)' _site/js/main.js
