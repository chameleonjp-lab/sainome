name: Quality checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node tests and release verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Check release script syntax
        run: npm run check:release-syntax

      - name: Build versioned release artifact
        env:
          SAINOME_RELEASE: ${{ github.sha }}
        run: npm run build:pages

      - name: Verify versioned release artifact
        env:
          SAINOME_RELEASE: ${{ github.sha }}
        run: npm run verify:pages
